# Local organizer stack. Participant-style services run on an internal network with no egress.
x-hardened: &hardened
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 1.0

services:
  baseline-defense:
    <<: *hardened
    build: {context: ., dockerfile: infra/docker/Dockerfile}
    image: sentinel-bench:local
    command: ["serve", "defense", "--baseline", "provenance", "--host", "0.0.0.0", "--port", "8080"]
    networks: [sentinel-internal]

  baseline-attacker:
    <<: *hardened
    image: sentinel-bench:local
    command: ["serve", "attacker", "--baseline", "mutation", "--host", "0.0.0.0", "--port", "8081"]
    networks: [sentinel-internal]

  evaluator:
    <<: *hardened
    image: sentinel-bench:local
    profiles: [eval]
    depends_on: [baseline-defense]
    command: ["eval", "public", "--defense-url", "http://baseline-defense:8080", "--artifacts", "/data/artifacts"]
    volumes: ["sentinel-data:/data"]
    networks: [sentinel-internal]

  leaderboard:
    <<: *hardened
    image: sentinel-bench:local
    command: ["serve", "leaderboard", "--db", "/data/leaderboard.sqlite3", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:?set SENTINEL_ADMIN_TOKEN}
    volumes: ["sentinel-data:/data"]
    ports: ["127.0.0.1:8090:8090"]
    networks: [sentinel-public]

networks:
  sentinel-internal:
    internal: true   # no route to the internet
  sentinel-public: {}

volumes:
  sentinel-data: {}
